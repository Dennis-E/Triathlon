<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="t d"><title id="t">One workout multiplies into many</title><desc id="d">A single workout icon branches into a grid of activity records.</desc><style>.s{fill:none;stroke:#cbd5e1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.i{stroke:#818cf8}.e{stroke:#34d399}.a{stroke:#fbbf24}.grow{animation:grow 2.5s ease-in-out infinite alternate;transform-origin:205px 85px}@keyframes grow{to{opacity:.55;transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="25" y="57" width="58" height="48" rx="7" class="s i"/><path d="M45 91V70l20 10-20 11z" fill="#34d399"/><text x="30" y="122" fill="#cbd5e1" font-size="9" font-family="sans-serif">ONE SESSION</text><path d="M91 81h38m-8-8 8 8-8 8" class="s a"/><g class="grow" fill="#111827" stroke-width="2"><rect x="148" y="31" width="42" height="31" rx="4" stroke="#818cf8"/><rect x="201" y="31" width="42" height="31" rx="4" stroke="#34d399"/><rect x="254" y="31" width="42" height="31" rx="4" stroke="#fbbf24"/><rect x="148" y="75" width="42" height="31" rx="4" stroke="#34d399"/><rect x="201" y="75" width="42" height="31" rx="4" stroke="#fbbf24"/><rect x="254" y="75" width="42" height="31" rx="4" stroke="#818cf8"/><rect x="148" y="119" width="42" height="25" rx="4" stroke="#fbbf24"/><rect x="201" y="119" width="42" height="25" rx="4" stroke="#818cf8"/><rect x="254" y="119" width="42" height="25" rx="4" stroke="#34d399"/></g><g fill="#cbd5e1"><circle cx="160" cy="42" r="3"/><circle cx="213" cy="42" r="3"/><circle cx="266" cy="42" r="3"/><circle cx="160" cy="86" r="3"/><circle cx="213" cy="86" r="3"/><circle cx="266" cy="86" r="3"/></g><text x="194" y="151" fill="#cbd5e1" font-size="9" font-family="sans-serif">HUNDREDS OF ACTIVITIES</text></svg>