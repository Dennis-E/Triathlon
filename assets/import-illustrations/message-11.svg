<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="t d"><title id="t">Watch restores a lost activity</title><desc id="d">A missing activity card reappears after being saved by a GPS watch.</desc><style>.s{fill:none;stroke:#cbd5e1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.i{stroke:#818cf8}.e{stroke:#34d399}.a{stroke:#fbbf24}.appear{animation:appear 2.8s ease-in-out infinite}@keyframes appear{0%,35%{opacity:.12;transform:translateY(8px)}70%,100%{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="38" y="43" width="53" height="75" rx="13" class="s i"/><rect x="49" y="56" width="31" height="47" rx="4" class="s a"/><path d="M58 44V32h14v12m-14 75v9h14v-9" class="s i"/><path d="M58 82l7-9 6 8 5-5" class="s e"/><path d="M111 81h44m-8-8 8 8-8 8" class="s a"/><g class="appear"><rect x="172" y="44" width="111" height="75" rx="8" fill="#111827" stroke="#34d399" stroke-width="3"/><path d="M187 96l17-22 14 14 15-20 27 29" class="s e"/><circle cx="194" cy="59" r="5" fill="#fbbf24"/><text x="188" y="135" fill="#cbd5e1" font-size="10" font-family="sans-serif">ACTIVITY SAVED</text></g><path d="M115 111q13 11 26 0" class="s" stroke-dasharray="3 5"/></svg>